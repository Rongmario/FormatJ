[versions]
junit = "6.1.3"
maven = "3.9.16"
maven-plugin-annotations = "3.15.1"
cleanroom-versioning = "2.0.0"
plugin-publish = "2.1.1"
intellij-platform = "2.18.1"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "6.1.3" }
maven-plugin-api = { module = "org.apache.maven:maven-plugin-api", version.ref = "maven" }
maven-core = { module = "org.apache.maven:maven-core", version.ref = "maven" }
maven-plugin-annotations = { module = "org.apache.maven.plugin-tools:maven-plugin-annotations", version.ref = "maven-plugin-annotations" }

[plugins]
cleanroom-versioning = { id = "com.cleanroommc.versioning", version.ref = "cleanroom-versioning" }
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "plugin-publish" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-platform" }
